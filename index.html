<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/logo-al.svg" />
    <link rel="alternate icon" type="image/png" href="/logo-al.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS PWA -->
    <link rel="apple-touch-icon" href="/logo-al.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Recetario AL" />
    <!-- "default" adapta el color del texto de la barra de status a claro/oscuro -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Viewport con cover para que la app llegue hasta los bordes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Color de la barra del navegador / PWA splash -->
    <meta name="theme-color" content="#e8572a" />

    <title>Recetario AL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
